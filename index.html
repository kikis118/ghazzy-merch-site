<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#0a0908" />
  <title>GhazzyTV Merch — Work in Progress</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0908'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23c8a84e'%3EG%3C/text%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --ink:#0a0908; --panel:#12100d; --gold:#c8a84e; --gold-soft:#e2c97e; --bone:#e8dfcf; --ash:#9b9386; --line:rgba(200,168,78,.28); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(ellipse at 50% -10%, rgba(175,96,37,.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 115%, rgba(200,168,78,.10) 0%, transparent 55%),
        var(--ink);
      color: var(--bone);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .frame {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18,16,13,.92), rgba(10,9,8,.94));
      padding: clamp(28px, 7vw, 68px) clamp(22px, 6vw, 64px);
      position: relative;
      text-align: center;
      box-shadow: 0 0 80px rgba(0,0,0,.7), inset 0 0 60px rgba(200,168,78,.04);
    }
    .frame::before, .frame::after {
      content: ""; position: absolute; width: 22px; height: 22px; border-color: var(--gold); opacity: .7;
    }
    .frame::before { top: 10px; left: 10px; border-top: 1px solid; border-left: 1px solid; }
    .frame::after { bottom: 10px; right: 10px; border-bottom: 1px solid; border-right: 1px solid; }
    .kicker { margin: 0 0 26px; font-family: Georgia, "Times New Roman", serif; font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: var(--gold-soft); }
    .badge { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--line); padding: 8px 14px; font-family: Georgia, "Times New Roman", serif; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.85); } 50% { opacity:1; transform:scale(1); } }
    h1 { margin: 26px 0 18px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(34px, 7vw, 62px); line-height: 1.02; letter-spacing: -.02em; color: var(--bone); }
    h1 em { color: var(--gold); font-style: italic; }
    .copy { margin: 0 auto; max-width: 52ch; font-size: clamp(15px, 2.2vw, 18px); line-height: 1.7; color: #cdc4b4; }
    .copy strong { color: var(--gold-soft); font-weight: 600; }
    .actions { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 20px; border: 1px solid var(--gold); background: var(--gold); color: var(--ink); text-decoration: none; font-family: Georgia, "Times New Roman", serif; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; transition: background .2s ease, border-color .2s ease, transform .2s ease, color .2s ease; }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn:hover { background: var(--gold-soft); border-color: var(--gold-soft); transform: translateY(-1px); }
    .btn.secondary { background: transparent; color: var(--gold-soft); border-color: var(--line); }
    .btn.secondary:hover { background: rgba(200,168,78,.08); color: var(--gold); border-color: var(--gold); }
    .fine { margin: 26px auto 0; max-width: 46ch; padding-top: 22px; border-top: 1px solid rgba(200,168,78,.16); font-size: 12px; line-height: 1.7; letter-spacing: .04em; color: var(--ash); }
    .mark { margin-top: 30px; font-family: Georgia, "Times New Roman", serif; font-size: 10px; letter-spacing: .36em; text-transform: uppercase; color: rgba(200,168,78,.6); }
    @media (max-width: 420px) { .actions { flex-direction: column; } .btn { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .btn { transition: none; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="kicker">GhazzyTV Merch</p>
    <div class="badge"><span class="dot" aria-hidden="true"></span> Work in progress</div>
    <h1>Available when <em>PoE2 1.0</em> launches.</h1>
    <p class="copy">We're prepping merch for <strong>YOU</strong> for the <strong>PoE2 1.0 launch</strong> — stay tuned.</p>
    <div class="actions">
      <a class="btn" href="https://www.twitch.tv/ghazzytv" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.3 0 1.5 4.7v16.6h5.6V24h3.1l2.8-2.7h4.2l6.8-6.6V0H4.3Zm16.1 13.7-3.7 3.6h-5.7l-2.8 2.7v-2.7H3.6V1.9h16.8v11.8Z"/><path d="M11.2 6.1h2v6h-2zm5.5 0h2v6h-2z"/></svg>
        Watch on Twitch
      </a>
      <a class="btn secondary" href="https://x.com/GhazzyTV" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.4l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93Zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41Z"/></svg>
        Follow on X
      </a>
    </div>
    <p class="fine">All shop pages are offline while we finish the build. Follow the stream for the drop.</p>
    <p class="mark">GhazzyTV</p>
  </main>
</body>
</html>
