<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#0a0908" />
  <title>GhazzyTV Merch — Work in Progress</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0908'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23c8a84e'%3EG%3C/text%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --ink:#0a0908; --panel:#12100d; --gold:#c8a84e; --gold-soft:#e2c97e; --bone:#e8dfcf; --ash:#9b9386; --line:rgba(200,168,78,.28); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(ellipse at 50% -10%, rgba(175,96,37,.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 115%, rgba(200,168,78,.10) 0%, transparent 55%),
        var(--ink);
      color: var(--bone);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .frame {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18,16,13,.92), rgba(10,9,8,.94));
      padding: clamp(28px, 7vw, 68px) clamp(22px, 6vw, 64px);
      position: relative;
      text-align: center;
      box-shadow: 0 0 80px rgba(0,0,0,.7), inset 0 0 60px rgba(200,168,78,.04);
    }
    .frame::before, .frame::after {
      content: ""; position: absolute; width: 22px; height: 22px; border-color: var(--gold); opacity: .7;
    }
    .frame::before { top: 10px; left: 10px; border-top: 1px solid; border-left: 1px solid; }
    .frame::after { bottom: 10px; right: 10px; border-bottom: 1px solid; border-right: 1px solid; }
    .kicker { margin: 0 0 26px; font-family: Georgia, "Times New Roman", serif; font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: var(--gold-soft); }
    .badge { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--line); padding: 8px 14px; font-family: Georgia, "Times New Roman", serif; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.85); } 50% { opacity:1; transform:scale(1); } }
    h1 { margin: 26px 0 18px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(34px, 7vw, 62px); line-height: 1.02; letter-spacing: -.02em; color: var(--bone); }
    h1 em { color: var(--gold); font-style: italic; }
    .copy { margin: 0 auto; max-width: 52ch; font-size: clamp(15px, 2.2vw, 18px); line-height: 1.7; color: #cdc4b4; }
    .fine { margin: 26px auto 0; max-width: 46ch; padding-top: 22px; border-top: 1px solid rgba(200,168,78,.16); font-size: 12px; line-height: 1.7; letter-spacing: .04em; color: var(--ash); }
    .mark { margin-top: 30px; font-family: Georgia, "Times New Roman", serif; font-size: 10px; letter-spacing: .36em; text-transform: uppercase; color: rgba(200,168,78,.6); }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="kicker">GhazzyTV Merch</p>
    <div class="badge"><span class="dot" aria-hidden="true"></span> Work in progress</div>
    <h1>The forge is <em>still hot.</em></h1>
    <p class="copy">The new store is being rebuilt from the ground up. Nothing is available to buy yet — check back soon.</p>
    <p class="fine">All shop pages are offline while we finish the build. This is an early placeholder, not the live store.</p>
    <p class="mark">GhazzyTV</p>
  </main>
</body>
</html>
